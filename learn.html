<!doctype html><meta charset=utf-8><meta name=viewport content="width=1280"><title>Learn</title><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=JetBrains+Mono:wght@600&display=swap" rel=stylesheet><style>:root{--p:#5B4BFF;--pd:#3E2FD6;--pt:#ECEAFF;--mint:#22C997;--mintd:#149A73;--sun:#FFC933;--sund:#E0A800;--co:#FF5D6C;--cod:#D93B4B;--sky:#3BB8F5;--skyd:#1F94CC;--bg:#F7F6FF;--ink:#26224A;--mut:#7A7699;--line:#E3E0F5;--code:#231F4D}
*{box-sizing:border-box;margin:0}
body{width:1280px;background:#D9D5F0;display:flex;flex-direction:column;gap:40px;font-family:'Fredoka',system-ui,sans-serif;font-weight:500;color:var(--ink)}
.frame{width:1280px;height:800px;background:#fff;display:flex;overflow:hidden}.col{flex-direction:column}
.mono{font-family:'JetBrains Mono',Consolas,monospace}
.side{width:240px;flex:none;padding:24px 16px;border-right:2px solid var(--line);display:flex;flex-direction:column;gap:6px}
.logo{font-weight:700;font-size:28px;color:var(--p);padding:0 8px 22px;display:flex;align-items:center;gap:10px}
.lg{width:34px;height:34px;border-radius:11px;background:var(--p);box-shadow:0 3px 0 var(--pd);color:#fff;font:700 15px 'JetBrains Mono',monospace;display:flex;align-items:center;justify-content:center}
.nav{padding:12px 14px;border-radius:16px;font-weight:600;font-size:16px;display:flex;gap:14px;align-items:center;border:2px solid transparent;color:var(--mut)}
.nav.on{background:var(--pt);border-color:var(--p);color:var(--p)}
.ic{width:26px;height:26px;border-radius:9px;background:currentColor;opacity:.4}
.btn{display:inline-flex;align-items:center;justify-content:center;height:52px;padding:0 30px;border-radius:16px;font-weight:700;font-size:17px;color:#fff;background:var(--p);box-shadow:0 4px 0 var(--pd)}
.btn.o{background:#fff;color:var(--p);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.g{background:var(--mint);box-shadow:0 4px 0 var(--mintd)}.btn.r{background:var(--co);box-shadow:0 4px 0 var(--cod)}.btn.d{background:var(--line);color:#A9A5C7;box-shadow:0 4px 0 #CFCBE8}
.pill{font-weight:700;font-size:18px;display:flex;gap:6px;align-items:center}
.mas{width:64px;height:64px;flex:none;border-radius:22px;background:var(--p);box-shadow:0 4px 0 var(--pd);position:relative}
.mas i{position:absolute;top:20px;width:10px;height:15px;border-radius:6px;background:#fff}.mas i:nth-child(1){left:15px}.mas i:nth-child(2){right:15px}
.mas b{position:absolute;left:23px;top:42px;width:18px;height:9px;border-radius:0 0 12px 12px;background:var(--sun)}
.mas.sad b{border-radius:12px 12px 0 0;top:44px;background:#fff}
.win{background:var(--code);border-radius:20px;color:#EDEBFF;padding:14px 0}
.ln{display:flex;font:600 21px/1.8 'JetBrains Mono',monospace;white-space:pre}.ln span{width:56px;text-align:right;padding-right:22px;color:#5F5A96}
.k{color:#FF8FB1}.f{color:#6EE7FF}
.bl{display:inline-block;min-width:100px;text-align:center;border-radius:8px;background:rgba(255,201,51,.18);border-bottom:3px solid var(--sun);color:var(--sun)}
.bl.ok{background:rgba(34,201,151,.25);border-color:var(--mint);color:#5CF0C0}.bl.bad{background:rgba(255,93,108,.25);border-color:var(--co);color:#FF9AA4}
.key{min-width:72px;height:56px;padding:0 22px;border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;background:#fff;font:600 19px 'JetBrains Mono',monospace;display:flex;align-items:center;justify-content:center}
.key.used{background:var(--bg);border-style:dashed;border-bottom-width:2px;color:transparent}
.tag{font-weight:600;font-size:14px;background:var(--pt);color:var(--p);padding:5px 12px;border-radius:10px}
.card{border:2px solid var(--line);border-radius:20px;padding:20px;background:#fff}
.bar{flex:1;height:16px;border-radius:8px;background:var(--line)}.bar i{display:block;height:100%;border-radius:8px;background:var(--p)}
.lbl{font-weight:600;font-size:14px;color:var(--mut);margin-bottom:6px}
.inp{background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-size:16px;margin-bottom:16px}
.node{width:76px;height:76px;border-radius:26px;background:var(--mint);box-shadow:0 6px 0 var(--mintd);color:#fff;font-size:32px;font-weight:700;display:flex;align-items:center;justify-content:center;position:relative}
.node.cur{background:var(--p);box-shadow:0 6px 0 var(--pd)}.node.lock{background:var(--line);box-shadow:0 6px 0 #CFCBE8;color:#A9A5C7}
.unit{width:100%;border-radius:20px;padding:18px 24px;color:#fff;background:var(--p);box-shadow:0 4px 0 var(--pd);display:flex;justify-content:space-between;align-items:center}
.unit.lock{background:var(--line);color:var(--mut);box-shadow:0 4px 0 #CFCBE8}.unit h2{font-size:24px;font-weight:700}.unit p{font-size:15px;opacity:.9}
.chip{padding:10px 20px;border:2px solid var(--line);border-radius:14px;font-weight:600;color:var(--mut)}.chip.on{background:var(--pt);border-color:var(--p);color:var(--p)}
.foot{margin-top:auto;height:132px;border-top:2px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 200px}
.foot.ok{background:#D9FBEC;border-color:#D9FBEC;color:var(--mintd)}.foot.bad{background:#FFE3E6;border-color:#FFE3E6;color:var(--cod)}
.foot h3{font-size:26px;font-weight:700}.foot p{font-size:16px;font-weight:500}
.qi{padding:12px 14px;border:2px solid var(--line);border-radius:16px;font-weight:600}.qi small{display:block;font-size:13px;color:var(--mut);font-weight:500;margin-top:2px}.qi.on{border-color:var(--p);background:var(--pt)}
</style><body>
<div class=frame>
<div class=side><div class=logo><span class=lg>{}</span>Codeigo</div>
<div class="nav on"><span class=ic></span>Learn</div>
<div class="nav"><span class=ic></span>Create</div>
<div class="nav"><span class=ic></span>Practice</div>
<div class="nav"><span class=ic></span>Profile</div>
<div class="nav"><span class=ic></span>Settings</div>
</div>
<div style="flex:1;padding:28px 40px;display:flex;flex-direction:column;gap:20px;align-items:center">
<div style="display:flex;gap:10px;align-self:flex-start"><span class="chip on">Python</span><span class=chip>JavaScript</span><span class=chip>C++</span></div>
<div class=unit><div><h2>Loops</h2><p>Lesson 3 of 4: while loops</p></div><span class="btn o" style="height:44px;padding:0 20px;font-size:15px">Guide</span></div>
<div class=node style="left:-40px">✓</div><div class=node style="left:0">✓</div>
<div style="position:relative;left:40px"><div style="position:absolute;top:-52px;left:-6px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:6px 16px;font-weight:700;color:var(--p)">Start</div><div class="node cur">★</div></div>
<div class="node lock" style="left:0">★</div>
<div class="unit lock"><div><h2>Arrays</h2><p>Finish Loops to unlock</p></div></div></div>
<div style="width:320px;flex:none;padding:28px 24px;display:flex;flex-direction:column;gap:18px;border-left:2px solid var(--line)">
<div style="display:flex;justify-content:space-between"><span class=pill style="color:var(--sund)">🔥 12</span><span class=pill style="color:var(--sky)">◆ 340</span><span class=pill style="color:var(--co)">♥ 5</span></div>
<div class=card><div style="font-weight:700;font-size:19px;margin-bottom:12px">Daily goal</div><div class=bar><i style="width:66%;background:var(--sun)"></i></div><div style="margin-top:8px;color:var(--mut)">20 of 30 XP</div></div>
<div class=card style="display:flex;gap:16px;align-items:center"><div class=mas><i></i><i></i><b></b></div><div><div style="font-weight:700;font-size:18px;margin-bottom:8px">Make a quiz</div><span class=btn style="height:38px;padding:0 16px;font-size:14px">Create</span></div></div>
</div></div></body>
